[project]
name = "ledgerkit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.54.0",
    "sqlalchemy[asyncio]",
    "alembic>=1.20.0",
    "asgi-correlation-id>=5.0.1",
    "fastapi-problem>=0.12.1",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
